# 依存の更新を、GitHub が自動で PR にして知らせる
# - github-actions: release.yml・ci.yml で SHA 固定している Action の新しい版
# - npm: devDependencies（TypeScript・Oxlint・vsce・テスト用のツール）の新しい版
# どちらも、公開されてから 7 日たった版だけを提案する（出た直後に乗っ取られた版を取り込まないように）
# PR を作るだけで、マージはしない
# 中身を見てから自分でマージする
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # engines.vscode（^1.94.0）と合わせるため、@types/vscode は手で上げる
      - dependency-name: '@types/vscode'
      # 拡張が動く VS Code の Node（20）に合わせるため、@types/node のメジャーは手で上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
