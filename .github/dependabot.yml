# 依存の更新を、GitHub が自動で PR にして知らせる
# - github-actions: release.yml で SHA 固定している Action の新しい版
# - npm: devDependencies（TypeScript・vsce・テスト用のツール）の新しい版
# PR を作るだけで、マージはしない
# 中身を見てから自分でマージする
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # engines.vscode（^1.94.0）と合わせるため、@types/vscode は手で上げる
      - dependency-name: '@types/vscode'
      # typescript-eslint が TypeScript 6.0 までしか対応していないので、6.1 以上には上げない
      # typescript-eslint が 7 に対応したら、この行を消す
      - dependency-name: typescript
        versions: ['>=6.1.0']
