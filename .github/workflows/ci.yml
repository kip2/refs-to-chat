# PR と main への push で、依存のインストール・リンター（Oxlint）・ユニットテスト・VSIX の作成を確かめる
# Dependabot の PR もここで確かめるので、壊れる更新は取り込む前に気づける
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR で新しく push されたら、古い実行は止める（main への push は止めずに、すべて確かめる）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: 依存を入れる（依存パッケージのインストールスクリプトは動かさない）
        run: npm ci --ignore-scripts

      - name: リンター（Oxlint）
        run: npm run lint

      - name: ユニットテスト（先に TypeScript をコンパイルする）
        run: npm test

      - name: vsix を作れるか
        run: npx --no-install vsce package --out check.vsix
