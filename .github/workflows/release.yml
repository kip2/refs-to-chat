# vsix を作って配る
# - タグ v* を push したとき: テスト → vsix を作る → GitHub の Releases に添付
# - ブランチを選んで手動で実行: テスト → vsix を作る → Actions の成果物に置くだけ
#
# 安全のため、依存を入れてビルドするジョブ（package）は読み取り権限だけで動かす
# Releases に書き込むジョブ（release）は依存を入れず、作った vsix を受け取って添付するだけにする
# 外部の Action は、タグの付け替えで中身が変わらないようにコミットの SHA で固定している
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 同じタグのリリースを同時に作らない（途中で止めずに、順番に動かす）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: タグと package.json の version が一致しているか確認
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の version ($version) が一致しません"
            exit 1
          fi

      - name: 依存を入れる（依存パッケージのインストールスクリプトは動かさない）
        run: npm ci --ignore-scripts

      - name: リンター（Oxlint）
        run: npm run lint

      - name: ユニットテスト（先に TypeScript をコンパイルする）
        run: npm test

      - name: vsix を作る
        id: pack
        run: |
          version=$(node -p "require('./package.json').version")
          file="right-click-mention-$version.vsix"
          npx --no-install vsce package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Actions の成果物に置く
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  release:
    needs: package
    # タグを push したときだけ（手動実行でタグを選んでも、リリースは作らない）
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Releases の作成に必要
      id-token: write # attestation の署名用
      attestations: write # attestation の保存用
    steps:
      # リリースの説明文に使う CHANGELOG.md だけを取り出す（依存は入れない）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # この vsix がこのリポジトリの Actions で作られたことを証明する
      # ダウンロードした人は gh attestation verify <vsix> -R kip2/right-click-mention で確かめられる
      - name: 出どころの証明を付ける
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.package.outputs.file }}

      # CHANGELOG.md の「## [x.y.z]」から次の「## [」の手前までを、説明文にする
      - name: リリースの説明文を CHANGELOG.md から取り出す
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md に [$version] の項目がありません"
            exit 1
          fi
          cat notes.md

      - name: Releases に添付（同じタグのリリースが既にあれば vsix と説明文を差し替える）
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.package.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
