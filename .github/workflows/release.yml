# vsix を作って配る
# - タグ v* を push したとき: テスト → vsix を作る → GitHub の Releases に添付
# - Actions 画面から手動で実行したとき: テスト → vsix を作る → Actions の成果物（Artifacts）に置く
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # Releases の作成に必要

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: タグと package.json の version が一致しているか確認
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の version ($version) が一致しません"
            exit 1
          fi

      - name: 依存を入れる
        run: npm ci

      - name: ユニットテスト（先に TypeScript をコンパイルする）
        run: npm test

      - name: vsix を作る
        id: pack
        run: |
          version=$(node -p "require('./package.json').version")
          file="right-click-mention-$version.vsix"
          npx vsce package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Actions の成果物に置く
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}

      - name: Releases に添付
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
